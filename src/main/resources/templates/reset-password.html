<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Set New Password | I-ITSM</title>
    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body class="center">

<main class="box">

    <h2>Set a new password</h2>

    <p>
        Your email has been verified.
        Choose a new password.
    </p>

    <p class="msg err"
       th:if="${error}"
       th:text="${error}">
    </p>

    <form method="post"
          th:action="@{/forgot-password/reset}">
        
        <input type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}">

        <label>
            Email

            <input name="email"
                   type="email"
                   th:value="${email}"
                   readonly>
        </label>

        <label>
            New password

            <input name="password"
                   type="password"
                   minlength="8"
                   required>
        </label>

        <label>
            Confirm new password

            <input name="confirmPassword"
                   type="password"
                   minlength="8"
                   required>
        </label>

        <button type="submit">
            Change password
        </button>

    </form>

</main>

</body>
</html>

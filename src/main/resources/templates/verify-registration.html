<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Verify Email | I-ITSM</title>
    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body class="center">

<main class="box">

    <h2>Verify your email</h2>

    <p>
        Enter the 6-digit OTP sent to your email.
    </p>

    <p class="msg ok"
       th:if="${ok}"
       th:text="${ok}">
    </p>

    <p class="msg err"
       th:if="${error}"
       th:text="${error}">
    </p>

    <form method="post"
          th:action="@{/register/verify}">

        <input type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}">

        <label>
            Email
            <input name="email"
                   type="email"
                   th:value="${email}"
                   required>
        </label>

        <label>
            OTP
            <input name="otp"
                   type="text"
                   inputmode="numeric"
                   pattern="[0-9]{6}"
                   maxlength="6"
                   required
                   autofocus>
        </label>

        <button type="submit">
            Verify and create account
        </button>

    </form>

    <p>
        <a th:href="@{/register}">
            Start registration again
        </a>
    </p>

</main>

</body>
</html>

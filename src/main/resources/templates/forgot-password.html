<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Forgot Password | I-ITSM</title>
    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body class="center">

<main class="box">

    <h2>Forgot your password?</h2>

    <p>
        Enter your registered email address.
        We will send you an OTP.
    </p>

    <p class="msg err"
       th:if="${error}"
       th:text="${error}">
    </p>

    <form method="post"
          th:action="@{/forgot-password}">

        <input type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}">

        <label>
            Email
            <input name="email"
                   type="email"
                   required
                   autofocus>
        </label>

        <button type="submit">
            Send OTP
        </button>

    </form>

    <p>
        <a th:href="@{/login}">
            Back to login
        </a>
    </p>

</main>

</body>
</html>
